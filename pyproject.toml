[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent"
version = "0.6.0"
description = "Controlled multi-agent automation system"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6.0,<7",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-mock>=3.11",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]
ignore = ["I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
