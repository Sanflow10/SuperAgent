services:
  superagent:
    build: { context: ., dockerfile: Dockerfile }
    container_name: superagent
    env_file: [.env]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: "2.0"
    volumes:
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - ./logs:/app/logs
      - ./sandbox:/app/sandbox
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import core, agents, tools; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
