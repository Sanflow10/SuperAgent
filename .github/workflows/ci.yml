# Auditoria externa 2026-10-01 (SA-003): o projeto não tinha CI —
# números de testes/lint eram só evidência local. Este workflow é o
# piso mínimo verificado publicamente a cada push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências (dev + build)
        run: python -m pip install -e ".[dev]" build

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy agents core tools main.py

      - name: Testes (pytest)
        run: pytest -q

      - name: Auditoria (audit.sh)
        run: ./audit.sh

      - name: Build (wheel + sdist)
        run: python -m build

      - name: Smoke da distribuição (instalação limpa)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import core, agents, tools; print('smoke ok')"
